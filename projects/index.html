<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForge | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --panel: #131b33;
            --text: #f4f7ff;
            --accent: #7c9cff;
            --accent-2: #b36dff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1a2451, var(--bg));
            color: var(--text);
            padding: 2rem;
        }

        .container {
            width: min(900px, 100%);
            margin: 0 auto;
            background: rgba(19, 27, 51, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .back-link {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 1rem;
        }

        h1 {
            margin-top: 0;
            font-size: clamp(2rem, 4vw, 3rem);
            font-family: "Space Grotesk", sans-serif;
        }

        p {
            color: #c9d3f8;
            line-height: 1.6;
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.1rem;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #0b1020;
            font-weight: 600;
            text-decoration: none;
            margin: 1rem 0 2rem;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            list-style: none;
            padding: 0;
        }

        .project-card {
            display: block;
            padding: 1rem;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text);
            background: linear-gradient(135deg, rgba(124, 156, 255, 0.2), rgba(179, 109, 255, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-2);
        }

        .project-card strong {
            display: block;
            margin-bottom: 0.35rem;
        }

        .project-card small {
            color: #c9d3f8;
        }

        .status-message {
            color: #c9d3f8;
        }
    </style>
</head>
<body>
    <main class="container">
        <a class="back-link" href="../index.html">← Back to DevForge</a>
        <h1>Projects</h1>
        <p>
            A live feed of public repositories from
            <strong>michellemercillead-hub</strong> on GitHub.
        </p>

        <a class="github-link" href="https://github.com/michellemercillead-hub" target="_blank" rel="noopener">
            View GitHub Profile ↗
        </a>

        <ul class="project-grid" aria-label="GitHub repositories" data-project-list>
            <li class="status-message">Loading repositories…</li>
        </ul>
    </main>

    <script>
        (async () => {
            const list = document.querySelector('[data-project-list]');

            try {
                const response = await fetch('https://api.github.com/users/michellemercillead-hub/repos?sort=updated');
                if (!response.ok) throw new Error('Request failed');
                const repos = await response.json();

                if (!Array.isArray(repos) || repos.length === 0) {
                    list.innerHTML = '<li class="status-message">No public repositories found.</li>';
                    return;
                }

                list.innerHTML = repos.map((repo) => `
                    <li>
                        <a class="project-card" href="${repo.html_url}" target="_blank" rel="noopener">
                            <strong>${repo.name}</strong>
                            <small>${repo.description ? repo.description : 'No description provided.'}</small>
                        </a>
                    </li>
                `).join('');
            } catch (error) {
                list.innerHTML = '<li class="status-message">Unable to load repositories right now. Please try the GitHub profile link above.</li>';
            }
        })();
    </script>
</body>
</html>
